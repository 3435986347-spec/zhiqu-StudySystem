# 集成测试不碰开发机上的真 Redis（第十三轮查出）。
#
# 原来 Spring 的集成测试连的是 application.yml 里的 localhost:6379 —— 开发机上正好开着一个，于是：
#   - 测试之间靠 Redis 串了状态：每次测试库都是新建的，用户 id、计划 id 从 1 开始，同一个幂等键第二次跑就拿到上一次缓存的
#     「成功」、一条任务都不建（并发暴力测试「同一个幂等键套用 20 次」时好时坏，查下来是这个）；
#   - 测试往开发者自己用的 Redis 里写限流窗口、幂等结果（真实的桌面应用也用它）。
# 指到一个没人监听的端口：锁、幂等、限流都走第七轮加的进程内替身 —— 每次跑都是干净的，也不碰真 Redis。
# 真要测 Redis 本身的，用自己的 Testcontainers Redis（IdempotencyServiceIntegrationTest 就是）。
spring.data.redis.host=127.0.0.1
spring.data.redis.port=1
spring.data.redis.timeout=2s

# 定时任务在测试里一律不跑（SchedulingConfig）。原来各个测试写的 spring.task.scheduling.enabled=false 是个不存在的属性，
# 写了等于没写：RAG worker 每秒在每个测试上下文里领作业，测试结束时卡在已经停掉的 MySQL 容器上，全量白等 30 秒。
# 要测定时任务本身的，直接调那个方法。
app.scheduling.enabled=false

# 连接池在测试里不留空闲连接（第十四轮）。每个测试类结束时它的 MySQL 容器先停了，而 Spring 的上下文缓存到 JVM 退出才关：
# 为了保住 minimum-idle，连接池会一直往那个已经没了的库上补连接（失败就退避重试，最长 5 秒一次）；关 JVM 时
# HikariPool.shutdown 要等补连接的线程停下（最长 loginTimeout = 30 秒），二十几个缓存的上下文一个个等，surefire 等满 30 秒强杀。
# minimum-idle=0 时，没人等连接就不去补。
spring.datasource.hikari.minimum-idle=0

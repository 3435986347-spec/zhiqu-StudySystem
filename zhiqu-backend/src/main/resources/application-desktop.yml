# 桌面应用形态的默认值。用 --spring.profiles.active=desktop 启用（打包时已写进启动参数）。
#
# 这里只放「桌面版和服务器版必须不同」的项；其余仍然来自 application.yml。
server:
  # 固定端口，不是随机端口。
  #
  # 「记住登录」要求它固定：WKWebView / 浏览器的 localStorage 按 origin（含端口）隔离，
  # 端口每次随机的话，上次记住的 token 这次在另一个 origin 里、读不到，于是每次都要重登。
  # 选一个不常用的高位端口避开冲突（8080 常被占，47615 基本不会）。真撞上了，原生外壳会
  # 走单实例逻辑连到已有实例；纯 java -jar 跑则启动失败并报明确的绑定错误。
  port: 47615
  # 硬前置：只有绑回环，代码工作区才会生效（见 WorkspaceAccess）。
  # 桌面版把它写死在这里，而不是交给用户配 —— 配错的后果是把你的磁盘开到局域网。
  address: 127.0.0.1

spring:
  # 注意：java.awt.headless 不能在这里配。
  # SpringApplication.run() 里 configureHeadlessProperty() 跑在 bindToSpringApplication()
  # 之前，所以 spring.main.headless 绑上来的时候系统属性早就被设成 true 了
  # （2026-09-21 实测：写了这一行，jcmd VM.system_properties 里仍是 java.awt.headless=true）。
  # 真正的开关是 jpackage 的 --java-options "-Djava.awt.headless=false"，
  # 见 deploy/desktop/package-macos.sh；为什么需要它见 DockPresence。
  #
  # 用户自己的配置放在 ~/.zhiqu/ 下，优先级高于打包进去的这份。
  # 数据库地址、AI 密钥、工作区根目录都在那里填，不必重新打包。
  config:
    import: "optional:file:${user.home}/.zhiqu/application.yml"

app:
  workspace:
    # 仍然默认关闭 —— 默认值本身就是安全边界。用户在 ~/.zhiqu/application.yml 里
    # 填 mode 和 root 才会打开。
    mode: OFF

<!DOCTYPE html>
<html lang="zh-CN" data-zq-mode="light" data-zq-accent="mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账号管理 - 知趣·象限 AI 办公助手</title>
  <script>(function(){try{var h=document.documentElement,t=localStorage.getItem('zq.theme'),d=t==='dark'||(t!=='light'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);h.setAttribute('data-zq-mode',d?'dark':'light');h.setAttribute('data-zq-accent',localStorage.getItem('zq.accent')==='gold'?'gold':'mono');}catch(e){}})();</script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261006-shell" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261006-shell">
  <link rel="manifest" href="manifest.json?v=20261006-shell">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261006-shell">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px;">
        <header class="zq-page-head">
          <div><h1 class="zq-h1">账号管理</h1></div>
          <div class="zq-page-actions">
            <input class="zq-input" placeholder="搜索用户名 / 邮箱" style="width:200px;">
            <select class="zq-select"><option>全部角色</option><option>管理员</option><option>普通用户</option></select>
            <button class="zq-btn">查询</button>
          </div>
        </header>

        <div class="zq-table">
          <div class="zq-scroll-x"><div style="min-width:830px;">
            <div class="zq-thead" style="display:grid; grid-template-columns:minmax(120px,1.1fr) minmax(150px,1.3fr) 74px 62px 102px 104px 128px; gap:8px; align-items:center;">
              <span>用户</span><span>邮箱</span><span>角色</span><span>状态</span><span>成就点数</span><span>最近活跃</span><span style="text-align:right;">操作</span>
            </div>
            <div id="zq-rows"></div>
          </div></div>
          <div style="padding:10px 16px; font-size:12px; color:var(--zq-text3);">禁用后该账号无法登录，数据保留</div>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261006-shell"></script>
  <script src="assets/zhiqu-api.js?v=20261006-shell"></script>
</body>
</html>

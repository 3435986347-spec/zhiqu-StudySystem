  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:18px;">

        <header class="zq-page-head">
          <div>
            <h1 class="zq-h1">先看今天，再看本周</h1>
            <span class="zq-page-sub">—</span>
          </div>
          <div class="zq-page-actions">
            <a class="zq-btn-ghost" href="ai-assistant.html?ask=%E5%B8%AE%E6%88%91%E7%9C%8B%E7%9C%8B%E4%BB%8A%E5%A4%A9%E7%9A%84%E4%BB%BB%E5%8A%A1%EF%BC%8C%E6%8C%89%E5%9B%9B%E8%B1%A1%E9%99%90%E6%8E%92%E4%B8%80%E4%B8%8B%E5%85%88%E5%81%9A%E4%BB%80%E4%B9%88"><span data-zq-icon="sparkles"></span>让 AI 排一下今天</a>
            <button class="zq-btn">新增任务</button>
          </div>
        </header>

        <!-- 概览卡 -->
        <section class="zq-grid" style="grid-template-columns:repeat(4, minmax(0,1fr));">
          <article class="zq-stat"><span class="zq-stat-label">今日待办</span><strong class="zq-stat-num">—</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">逾期未完</span><strong class="zq-stat-num" style="color:var(--zq-bad);">—</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">早间提醒</span><strong class="zq-stat-num">—</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">例行完成</span><strong class="zq-stat-num" style="color:var(--zq-primary);">—</strong>
            <div style="height:5px; margin-top:10px; overflow:hidden; border-radius:999px; background:var(--zq-tint);"><i id="zq-routine-bar" style="display:block; width:0%; height:100%; border-radius:inherit; background:var(--zq-primary);"></i></div>
          </article>
        </section>

        <div style="display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px; align-items:start;">
          <main style="display:flex; flex-direction:column; gap:18px; min-width:0;">

            <!-- 本周日历 -->
            <section class="zq-card zq-card-lg">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;">
                <div><p class="zq-eyebrow">本周日历</p><h2 class="zq-h2">本周</h2></div>
                <div style="display:inline-flex; align-items:center; gap:6px;">
                  <button class="zq-btn-ghost" data-week-nav="prev" aria-label="上一周" style="width:30px; padding:0;"><span data-zq-icon="chevron-left"></span></button>
                  <button class="zq-btn-ghost" data-week-nav="today" style="height:30px;">本周</button>
                  <button class="zq-btn-ghost" data-week-nav="next" aria-label="下一周" style="width:30px; padding:0;"><span data-zq-icon="chevron-right"></span></button>
                </div>
              </div>
              <div id="zq-week" style="display:grid; grid-template-columns:repeat(7, minmax(108px,1fr)); gap:9px; overflow-x:auto; padding-bottom:2px;"></div>
            </section>

            <!-- 今日行动清单 -->
            <section class="zq-card zq-card-lg">
              <div style="margin-bottom:14px;"><p class="zq-eyebrow">今天</p><h2 class="zq-h2">行动清单</h2></div>
              <div id="zq-today" style="display:flex; flex-direction:column; gap:9px;"></div>
            </section>

            <!-- 象限摘要 -->
            <section class="zq-card zq-card-lg">
              <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;">
                <div><p class="zq-eyebrow">象限摘要</p><h2 class="zq-h2">只显示关键待办</h2></div>
                <a href="tasks.html" class="zq-btn-ghost" style="height:30px;">进入任务页</a>
              </div>
              <div id="zq-quad" style="display:grid; grid-template-columns:repeat(auto-fit, minmax(178px,1fr)); gap:12px;"></div>
            </section>
          </main>

          <!-- 侧栏 -->
          <aside style="display:flex; flex-direction:column; gap:18px; position:sticky; top:24px;">
            <div class="zq-card zq-card-lg" style="text-align:center;">
              <h2 class="zq-h2" style="font-size:16px; margin-bottom:4px;">番茄钟</h2>
              <div id="zq-pomo-round" style="font-size:12px; color:var(--zq-text2); margin-bottom:10px;">专注一段时间，记进今天的专注时长</div>
              <div style="position:relative; width:190px; margin:0 auto;">
                <svg width="190" height="190" viewBox="0 0 200 200" aria-hidden="true">
                  <circle cx="100" cy="100" r="80" fill="none" stroke="var(--zq-card-soft)" stroke-width="9"></circle>
                  <circle id="zq-pomo-ring" cx="100" cy="100" r="80" fill="none" stroke="var(--zq-primary)" stroke-width="9" stroke-linecap="round" stroke-dasharray="0 502.4" transform="rotate(-90 100 100)" style="transition:stroke-dasharray .4s linear;"></circle>
                </svg>
                <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                  <div id="zq-pomo-time" class="zq-num" style="font-size:34px; font-weight:var(--zq-fw-medium); line-height:1;">25:00</div>
                  <div id="zq-pomo-phase" style="font-size:11.5px; color:var(--zq-text2); margin-top:6px;">待开始</div>
                </div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; text-align:left;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">专注时长</label><select class="zq-select" id="zq-pomo-min" style="height:30px;"><option value="25">25 分钟</option><option value="45">45 分钟</option><option value="60">60 分钟</option></select></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">关联任务</label><select class="zq-select" id="zq-pomo-task" style="height:30px;"><option value="">（不指定任务）</option></select></div>
              </div>
              <div style="display:flex; justify-content:center; gap:8px; flex-wrap:wrap;">
                <button class="zq-btn" id="zq-pomo-start" style="height:30px;">开始</button>
                <button class="zq-btn-ghost" id="zq-pomo-reset" style="height:30px;">重置</button>
              </div>
              <div id="zq-pomo-count" style="font-size:12px; color:var(--zq-text2); margin-top:12px; padding-top:10px; border-top:1px solid var(--zq-border-soft);">今日：—</div>
            </div>

            <section class="zq-card zq-card-lg">
              <div style="margin-bottom:10px;"><p class="zq-eyebrow">临近 DDL</p><h2 class="zq-h2" style="font-size:16px;">需要盯住的事</h2></div>
              <div id="zq-ddl" style="display:flex; flex-direction:column;"></div>
            </section>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261006-composer"></script>
  <script>
    // ── 番茄钟 ──
    // 按结束时刻倒数，不按「每跳一次减一秒」（第二十一轮）：切到别的标签页后浏览器把定时器限到一分钟一次，原来 25 分钟的番茄钟
    // 要走一整天；合上笔记本就停。时钟往回拨（校时、手动改时间）时结束时刻跟着往回挪 —— 剩下的时间不会变多、也不会卡住不走。
    (function(){
      var total=25*60, secs=total, running=false, timer=null, endAt=0, lastNow=0, C=2*Math.PI*80;
      var elTime=document.getElementById('zq-pomo-time'), elPhase=document.getElementById('zq-pomo-phase'), elRing=document.getElementById('zq-pomo-ring'), elStart=document.getElementById('zq-pomo-start'), elMin=document.getElementById('zq-pomo-min');
      function fmt(s){ return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
      function draw(){ elTime.textContent=fmt(secs); var frac=(total-secs)/total; elRing.setAttribute('stroke-dasharray',(frac*C).toFixed(1)+' '+C.toFixed(1)); }
      function zqPomoRecord(mins){
        if(mins<1||!window.zqApi||!window.zqApi.api) return;
        var sel=document.getElementById('zq-pomo-task');
        var tid=sel&&sel.value?Number(sel.value):null;
        // 先存在这台设备上再发：网断着也不丢，连上网自动补记；没记上、先存着都会说出来（zhiqu-api.js 的 recordPomodoro）。
        // 不带日期：记到服务端的「今天」（跨了天才补上的，由补记那一步带上完成那天）
        window.zqApi.recordPomodoro({taskId:tid,durationMinutes:mins,note:'番茄钟专注时段'}).catch(function(e){ window.zqApi.toast('这个番茄钟没记上：'+((e&&e.message)||'出错了'),'error'); });
      }
      // 结束了要让人知道（2026-10-03 走主流程：在别的标签页专注时，25 分钟到了页面上一点动静都没有）。
      // 标签页标题挂上「✓ 专注结束」，直到切回这一页；再响一声、弹浏览器通知（第二十五轮，授权在点「开始」时问）
      function announceDone(){
        var title=document.title.replace(/^✓ 专注结束 — /,'');
        document.title='✓ 专注结束 — '+title;
        // 响一声、弹浏览器通知（授权过的话）、页面里提示一句（第二十五轮）
        if(window.zqApi&&window.zqApi.notify) window.zqApi.notify('专注结束','记进今天的时长了，休息一下','zq-pomodoro');
        function restore(){ if(document.hidden) return; setTimeout(function(){ document.title=title; },4000); document.removeEventListener('visibilitychange',restore); }
        document.addEventListener('visibilitychange',restore); restore();
      }
      function tick(){
        if(!running) return;
        var now=Date.now();
        if(now<lastNow) endAt-=lastNow-now;          // 时钟往回拨了：结束时刻一起往回挪
        lastNow=now;
        secs=Math.max(0,Math.ceil((endAt-now)/1000));
        if(secs<=0){ clearInterval(timer); running=false; elStart.textContent='开始'; elPhase.textContent='已完成'; zqPomoRecord(Math.round(total/60)); announceDone(); secs=total; draw(); return; }
        draw();
      }
      elMin.addEventListener('change',function(){ if(running) return; total=parseInt(elMin.value,10)*60; secs=total; draw(); });
      elStart.addEventListener('click',function(){
        if(running){ tick(); clearInterval(timer); running=false; elStart.textContent='继续'; elPhase.textContent='已暂停'; return; }
        if(window.zqApi&&window.zqApi.askNotifyPermission) window.zqApi.askNotifyPermission();   // 到点要弹通知：在这次点击里问授权
        running=true; elStart.textContent='暂停'; elPhase.textContent='专注中';
        lastNow=Date.now(); endAt=lastNow+secs*1000;
        timer=setInterval(tick,1000);
      });
      // 切回这个标签页、笔记本醒来：马上按真实时间刷一次，不等下一跳
      document.addEventListener('visibilitychange',function(){ if(!document.hidden) tick(); });
      document.getElementById('zq-pomo-reset').addEventListener('click',function(){ clearInterval(timer); running=false; secs=total; elStart.textContent='开始'; elPhase.textContent='待开始'; draw(); });
      draw();
    })();
  </script>
  <script src="assets/zhiqu-api.js?v=20261006-composer"></script>
</body>
</html>

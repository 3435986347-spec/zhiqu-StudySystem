<!DOCTYPE html>
<html lang="zh-CN" data-zq-mode="light" data-zq-accent="mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>监管后台 - 知趣·象限 AI 办公助手</title>
  <script>(function(){try{var h=document.documentElement,t=localStorage.getItem('zq.theme'),d=t==='dark'||(t!=='light'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);h.setAttribute('data-zq-mode',d?'dark':'light');h.setAttribute('data-zq-accent',localStorage.getItem('zq.accent')==='gold'?'gold':'mono');}catch(e){}})();</script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261031-r85b" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261031-r85b">
  <link rel="manifest" href="manifest.json?v=20261031-r85b">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261031-r85b">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div class="zq-admin">
        <header class="zq-page-head">
          <div>
            <h1 class="zq-h1">监管后台</h1>
            <span class="zq-page-sub">平台运行总览 · 不展示用户任务与知识库正文</span>
          </div>
          <div class="zq-page-actions"><button type="button" class="zq-btn-ghost" id="zq-admin-refresh">刷新数据</button></div>
        </header>

        <section id="zq-metrics" class="zq-grid zq-admin-metrics"></section>

        <div class="zq-admin-cols">
          <section class="zq-card zq-card-lg">
            <div class="zq-admin-card-head"><h2 class="zq-h2">近 15 分钟请求量</h2><span>每分钟，单位：次</span></div>
            <div id="zq-traffic" class="zq-bars zq-admin-bars"></div>
          </section>
          <section class="zq-card zq-card-lg">
            <h2 class="zq-h2 zq-admin-card-title">运行状态</h2>
            <!--
              封顶 + 内部滚动。不封的话错误多时这一列会无限变长，而它和左边那栏同属一个
              grid —— grid 高度取最高的那列，于是下面的「RAG 语义检索」被推到很远的地方，
              错误越多推得越远。封顶的高度写在样式表（.zq-admin-health）。
            -->
            <div id="zq-health" class="zq-admin-health"></div>
          </section>
        </div>
        <section class="zq-card zq-card-lg">
          <div class="zq-admin-card-head"><div><h2 class="zq-h2">RAG 语义检索</h2><p>Sidecar、索引代次、任务积压与自动降级</p></div></div>
          <div id="zq-rag-status"><div class="zq-empty">正在读取语义检索状态…</div></div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261031-r85b"></script>
  <script src="assets/zhiqu-api.js?v=20261031-r85b"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN" data-zq-mode="light" data-zq-accent="mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>监管后台 - 知趣·象限 AI 办公助手</title>
  <script>(function(){try{var h=document.documentElement,t=localStorage.getItem('zq.theme'),d=t==='dark'||(t!=='light'&&!!window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);h.setAttribute('data-zq-mode',d?'dark':'light');h.setAttribute('data-zq-accent',localStorage.getItem('zq.accent')==='gold'?'gold':'mono');}catch(e){}})();</script>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261006-composer" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261006-composer">
  <link rel="manifest" href="manifest.json?v=20261006-composer">
  <meta name="theme-color" content="#FAFAFA" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261006-composer">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px;">
        <header class="zq-page-head">
          <div>
            <h1 class="zq-h1">监管后台</h1>
            <span class="zq-page-sub">平台运行总览 · 数据每 5 分钟刷新 · 不展示用户任务与知识库正文</span>
          </div>
          <div class="zq-page-actions"><button class="zq-btn-ghost">刷新数据</button></div>
        </header>

        <section id="zq-metrics" class="zq-grid" style="grid-template-columns:repeat(6, minmax(0,1fr));"></section>

        <div style="display:grid; grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr); gap:16px; align-items:start;">
          <section class="zq-card zq-card-lg">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;"><h2 class="zq-h2" style="font-size:16px;">近 15 分钟请求量</h2><span style="font-size:12px; color:var(--zq-text3);">单位：次</span></div>
            <div id="zq-traffic" style="display:flex; align-items:flex-end; gap:6px; height:170px; padding:0 4px;"></div>
          </section>
          <section class="zq-card zq-card-lg">
            <h2 class="zq-h2" style="font-size:16px; margin-bottom:12px;">运行状态</h2>
            <!--
              封顶 + 内部滚动。不封的话错误多时这一列会无限变长，而它和左边那栏同属一个
              grid —— grid 高度取最高的那列，于是下面的「RAG 语义检索」被推到很远的地方，
              错误越多推得越远。左栏的流量图是 170px 加表头，340px 让两栏大致齐平。
            -->
            <div id="zq-health" style="display:flex; flex-direction:column; max-height:340px; overflow-y:auto;"></div>
          </section>
        </div>
        <section class="zq-card zq-card-lg">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;">
            <div><h2 class="zq-h2" style="font-size:16px;">RAG 语义检索</h2><p style="margin-top:5px;font-size:12px;color:var(--zq-text3);">Sidecar、索引代次、任务积压与自动降级</p></div>
          </div>
          <div id="zq-rag-status"><div class="zq-empty">正在读取语义检索状态…</div></div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261006-composer"></script>
  <script src="assets/zhiqu-api.js?v=20261006-composer"></script>
</body>
</html>

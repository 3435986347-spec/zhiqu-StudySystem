<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>知识 Wiki - 知趣·象限 AI 办公助手</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261004-routines" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261004-routines">
  <link rel="manifest" href="manifest.json?v=20261004-routines">
  <meta name="theme-color" content="#2E538F">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261004-routines">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <!--
        height（不是 min-height）—— 内层正好等于视口减去 .zq-main 的上下 padding（110px），
        整页不产生外层滚动，正文在 #zq-doc 内部滚。目录收起后那个展开箭头在竖条顶端，
        外层一滚就够不到，所以这里必须是定高。
        但定高要有下限（第二十轮）：浏览器放大到 200%（1366×768 → 683×384）时定高之后正文区只剩 52px（标题和工具栏占满）。
        低于 520px 时宁可整页滚一点，正文得先看得见。手机上的高度见 zhiqu-ui.css 的 @media。
      -->
      <div style="display:flex; flex-direction:column; gap:12px; height:calc(100vh - 110px); min-height:520px; animation:zqFadeIn .3s ease both;">
        <header style="display:flex; align-items:center; justify-content:space-between; gap:18px; padding:2px 2px 0; flex-wrap:wrap;">
          <h1 class="zq-h1">知识 Wiki</h1>
          <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="zq-btn-ghost" style="height:30px; font-size:12.5px;">导入来源</button>
            <button style="height:30px; padding:0 12px; border:1px solid var(--zq-tint-strong); border-radius:var(--zq-rs); background:var(--zq-tint); color:var(--zq-primary); font-size:12.5px; font-weight:600; cursor:pointer;">待合入变更</button>
            <button class="zq-btn-ghost" style="height:30px; font-size:12.5px;">健康检查</button>
            <button class="zq-btn-ghost" style="height:30px; font-size:12.5px;">图谱</button>
            <button class="zq-btn-ghost" style="height:30px; font-size:12.5px;">导出</button>
            <button class="zq-btn" style="height:30px; font-size:12.5px;">新建知识页</button>
          </div>
        </header>

        <div style="display:flex; gap:12px; align-items:stretch; margin:0 -8px; flex:1; min-height:0;">
          <!-- 目录（默认收起） -->
          <aside id="zq-wiki-toc" data-zq-collapse="left" data-zq-label="目录" style="flex:0 0 210px; border:1px solid var(--zq-border-soft); border-radius:var(--zq-rm); background:var(--zq-card); box-shadow:var(--zq-sh1); overflow:hidden; align-self:stretch;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--zq-border-soft);"><h2 style="margin:0; font-size:14px; font-weight:700;">目录</h2><span id="zq-tree-count" style="font-size:11.5px; color:var(--zq-text3);"></span></div>
            <div style="padding:10px 12px; display:flex; flex-direction:column; gap:8px; border-bottom:1px solid var(--zq-border-soft);">
              <input class="zq-input" placeholder="搜索页面 / [[双链]]" style="height:28px; font-size:12px;">
              <select class="zq-select" style="height:28px; font-size:12px;"><option>全部类型</option><option>目标</option><option>计划</option><option>偏好</option><option>薄弱点</option><option>资料</option><option>对话摘要</option><option>index</option><option>规则</option><option>log</option></select>
            </div>
            <nav id="zq-tree" style="padding:8px; display:flex; flex-direction:column; gap:2px;"></nav>
          </aside>

          <!-- 文档视图。flex 列 + min-height:0 让 #zq-doc 能在内部滚动而不是把整页撑长。 -->
          <section style="flex:1; min-width:0; display:flex; flex-direction:column; min-height:0; border:1px solid var(--zq-border-soft); border-radius:var(--zq-rm); background:var(--zq-card); box-shadow:var(--zq-sh2); overflow:hidden;">
            <!--
              标签页栏（Obsidian 式）。由 zhiqu-api.js 的 paintWikiTabs() 填充；
              这里只留容器，因为标签是随打开的页面变的，写死在 HTML 里没有意义。
            -->
            <!--
              工具条：前进/返回 + 标签页，都在这一行 —— 和浏览器一样。
              它们原本放在下面的标题行里，结果把标题往右推了 76px，
              「文档视图 / log」比正文缩进得明显更多。导航按钮属于工具条，不属于标题。
            -->
            <div style="display:flex; align-items:stretch; border-bottom:1px solid var(--zq-border-soft); background:var(--zq-card-soft);">
              <!--
                标签栏左内边距 = 0：第一个标签的方框直接从知识页卡片的左边缘开始，
                和浏览器标签坐在页面上一样。正文与标题仍各自内缩 26px。

                这里返工了两次，每次都对齐错了对象 ——
                  1. 14px：让标签里的「文字」和正文文字同线；
                  2. 26px：让标签「方框」和正文文字同线。
                两次对齐的都是卡片<b>里面</b>的正文，而用户说的「下面的知识页」是那张卡片本身。
                26px 时实测卡片边缘 436、第一个标签 463，中间 27px 灰带就是那条「没对齐」。
                这次是先拿浏览器实拍前后对照（436 → 437 = 卡片内边缘）才改的，不是改完才看。
                导航按钮放右端 —— 放左端就把第一个标签从卡片边缘挤开了。
              -->
              <div id="zq-wiki-tabs" style="display:flex; align-items:stretch; gap:0; flex:1; min-width:0; padding-left:0; overflow-x:auto; scrollbar-width:thin;"></div>
              <div style="display:flex; align-items:center; gap:2px; padding:0 12px 0 6px; flex:0 0 auto;">
                <!-- 走当前标签页自己的浏览历史，和浏览器那对按钮同义 -->
                <button type="button" id="zq-wiki-back" class="zq-btn-ghost" title="返回上一页（⌘[）"
                  style="height:26px; width:24px; padding:0; font-size:15px; line-height:1;">‹</button>
                <button type="button" id="zq-wiki-fwd" class="zq-btn-ghost" title="前进（⌘]）"
                  style="height:26px; width:24px; padding:0; font-size:15px; line-height:1;">›</button>
              </div>
            </div>
            <!--
              padding-left 跟 #zq-doc 的 26px 一致 —— 标题和正文落在同一条竖线上。
              改 #zq-doc 的 26px 时这里要跟着改，WikiTabsTest.标题与正文左边缘要对齐 盯着。
            -->
            <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; padding:14px 20px 14px 26px; border-bottom:1px solid var(--zq-border-soft); flex-wrap:wrap;">
              <div style="min-width:0;"><p class="zq-eyebrow" style="margin-bottom:3px; font-size:10.5px;">文档视图</p><h2 id="zq-doc-title" class="zq-h2" style="font-size:16px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;"></h2></div>
              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                <span style="font-size:11.5px; color:var(--zq-text3);">点击正文或标题即可编辑</span>
                <span style="font-size:11.5px; color:var(--zq-text3);">段落</span>
                <select id="zq-wiki-block" class="zq-select" style="height:26px; font-size:12px; padding:0 6px; min-width:92px;">
                  <option value="P">正文</option>
                  <option value="H1">一级标题</option>
                  <option value="H2">二级标题</option>
                  <option value="H3">三级标题</option>
                  <option value="QUOTE">引用</option>
                  <option value="CODE">代码块</option>
                  <option value="UL">无序列表</option>
                  <option value="OL">有序列表</option>
                  <option value="TASK">任务项</option>
                  <option value="HR">分隔线</option>
                </select>
                <div class="zq-toolbar">
                  <button data-wiki-cmd="bold" class="zq-tbtn" style="font-weight:700;">B</button>
                  <button data-wiki-cmd="italic" class="zq-tbtn" style="font-style:italic;">I</button>
                  <button data-wiki-cmd="underline" class="zq-tbtn" style="text-decoration:underline;">U</button>
                  <button data-wiki-cmd="code" class="zq-tbtn zq-mono">`</button>
                  <button data-wiki-cmd="link" class="zq-tbtn">链接</button>
                  <button data-wiki-cmd="math" class="zq-tbtn">公式</button>
                  <button data-wiki-cmd="ref" class="zq-tbtn">参考</button>
                  <button data-wiki-cmd="source" class="zq-tbtn">源码</button>
                </div>
              </div>
            </div>
            <div id="zq-doc" style="padding:22px 26px 30px; flex:1; min-height:0; overflow-y:auto;"></div>
          </section>

          <!-- 页面检查（默认收起） -->
          <aside data-zq-collapse="right" data-zq-label="页面检查" style="flex:0 0 250px; border:1px solid var(--zq-border-soft); border-radius:var(--zq-rm); background:var(--zq-card); box-shadow:var(--zq-sh1); overflow:hidden; align-self:stretch;">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; border-bottom:1px solid var(--zq-border-soft); background:var(--zq-card-soft);"><h2 style="margin:0; font-size:14px; font-weight:700;">页面检查</h2></div>
            <div id="zq-insp"></div>
          </aside>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261004-routines"></script>
  <script src="assets/zhiqu-api.js?v=20261004-routines"></script>
</body>
</html>

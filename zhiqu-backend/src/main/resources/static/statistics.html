<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>专注统计 - 知趣·象限 AI 办公助手</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261004-tasks" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261004-tasks">
  <link rel="manifest" href="manifest.json?v=20261004-tasks">
  <meta name="theme-color" content="#2E538F">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261004-tasks">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px; animation:zqFadeIn .3s ease both;">
        <header style="padding:4px 2px 2px;"><p class="zq-eyebrow">数据洞察</p><h1 class="zq-h1">专注统计</h1></header>

        <section class="zq-grid" style="grid-template-columns:repeat(4, minmax(0,1fr));">
          <article class="zq-stat"><strong class="zq-stat-num">—</strong><span class="zq-stat-label" style="margin-top:9px;">连续专注天数</span></article>
          <article class="zq-stat"><strong class="zq-stat-num">—</strong><span class="zq-stat-label" style="margin-top:9px;">总专注时长（分钟）</span></article>
          <article class="zq-stat"><strong class="zq-stat-num">—</strong><span class="zq-stat-label" style="margin-top:9px;">完成任务数</span></article>
          <article class="zq-stat"><strong class="zq-stat-num">—</strong><span class="zq-stat-label" style="margin-top:9px;">总任务数</span></article>
        </section>

        <div style="display:grid; grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr); gap:16px; align-items:start;">
          <section class="zq-card zq-card-lg">
            <div style="display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; margin-bottom:16px;">
              <h2 class="zq-h2" style="font-size:16px;">专注时长趋势</h2>
              <div id="zq-tabs" style="display:inline-flex; border:1px solid var(--zq-border); border-radius:var(--zq-rs); overflow:hidden;"><button type="button" data-k="day" style="height:28px; padding:0 14px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:var(--zq-primary); color:var(--zq-on-primary);">日</button><button type="button" data-k="week" style="height:28px; padding:0 14px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:var(--zq-card); color:var(--zq-text2);">周</button><button type="button" data-k="month" style="height:28px; padding:0 14px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:var(--zq-card); color:var(--zq-text2);">月</button></div>
            </div>
            <div id="zq-bars" style="display:flex; align-items:flex-end; gap:7px; height:210px; padding:0 4px;"></div>
          </section>
          <section class="zq-card zq-card-lg">
            <h2 class="zq-h2" style="font-size:16px; margin-bottom:14px;">象限分布</h2>
            <div style="display:flex; align-items:center; justify-content:center; padding:6px 0 14px;">
              <div style="position:relative; width:172px; height:172px;">
                <svg width="172" height="172" viewBox="0 0 172 172" id="zq-donut"></svg>
                <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;">
                  <strong class="zq-mono" style="font-size:26px; line-height:1;">—</strong>
                  <span style="font-size:11px; color:var(--zq-text2); margin-top:4px;">本月任务</span>
                </div>
              </div>
            </div>
            <div id="zq-legend" style="display:flex; flex-direction:column; gap:8px;"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261004-tasks"></script>
  <script src="assets/zhiqu-api.js?v=20261004-tasks"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习统计 - 知趣·象限学习系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/statistics.css">
    <link rel="stylesheet" href="/css/pixel-theme.css">
</head>
<body>
    <div id="navbar"></div>
    <div class="main-content">
        <h1 class="statistics-title">📊 学习统计</h1>
        <div class="stat-cards" id="stat-cards"></div>
        <div class="charts-row">
            <div class="chart-box chart-trend">
                <div class="trend-tabs">
                    <button type="button" data-type="day" class="active">日</button>
                    <button type="button" data-type="week">周</button>
                    <button type="button" data-type="month">月</button>
                </div>
                <div id="chart-trend" class="chart-inner"></div>
            </div>
            <div class="chart-box chart-pie">
                <h3>象限分布</h3>
                <div id="chart-pie" class="chart-inner"></div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/statistics.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - 知趣·象限学习系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/profile.css">
    <link rel="stylesheet" href="/css/pixel-theme.css">
</head>
<body>
    <div id="navbar"></div>
    <div class="main-content">
        <h1 style="margin-top:0">👤 个人中心</h1>
        <div class="stat-cards" id="profile-stats"></div>
        <div class="profile-top">
            <div class="avatar-block card" style="padding:24px; min-width:160px; text-align:center">
                <div class="avatar-circle" id="avatar-circle">
                    <span id="avatar-letter"></span>
                    <img id="avatar-img" class="hidden" alt="头像">
                </div>
                <input type="file" id="avatar-file" accept="image/*" class="hidden">
                <button type="button" class="btn btn-default" id="btn-avatar" style="margin-top:4px">上传头像</button>
            </div>
            <div class="section" style="flex:1; min-width:260px">
                <h2>基本资料</h2>
                <div class="form-group">
                    <label>用户名</label>
                    <input id="pf-username" readonly>
                </div>
                <div class="form-group">
                    <label for="pf-nickname">昵称</label>
                    <input id="pf-nickname" placeholder="设置昵称">
                </div>
                <button type="button" class="btn btn-primary" id="btn-save-profile">保存昵称</button>
            </div>
        </div>
        <div class="section">
            <h2>修改密码</h2>
            <div class="form-group">
                <label for="pf-old-pw">旧密码</label>
                <input type="password" id="pf-old-pw" autocomplete="current-password" placeholder="输入旧密码">
            </div>
            <div class="form-group">
                <label for="pf-new-pw">新密码</label>
                <input type="password" id="pf-new-pw" autocomplete="new-password" placeholder="输入新密码（至少6位）">
            </div>
            <button type="button" class="btn btn-warning" id="btn-save-pw">更新密码</button>
        </div>
        <div class="section" id="ai-config-section">
            <h2>AI 模型配置</h2>
            <div class="form-group">
                <label for="ai-api-url">API 接口地址</label>
                <input type="text" id="ai-api-url" placeholder="https://api.openai.com/v1/chat/completions">
                <div class="form-hint">
                    支持 OpenAI、DeepSeek、通义千问等兼容 OpenAI 接口的服务。<br>
                    DeepSeek: https://api.deepseek.com/v1/chat/completions<br>
                    通义千问: https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions
                </div>
            </div>
            <div class="form-group">
                <label for="ai-api-key">API Key</label>
                <input type="password" id="ai-api-key" autocomplete="off" placeholder="sk-xxxxxxxxxxxx">
                <div class="form-hint">已保存的 Key 会脱敏显示，留空则不修改。</div>
            </div>
            <div class="form-group">
                <label for="ai-model-name">模型名称</label>
                <input type="text" id="ai-model-name" placeholder="gpt-3.5-turbo">
                <div class="form-hint">常用：gpt-3.5-turbo、gpt-4o、deepseek-chat、qwen-turbo</div>
            </div>
            <button type="button" class="btn btn-primary" id="btn-save-ai">保存 AI 配置</button>
        </div>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>

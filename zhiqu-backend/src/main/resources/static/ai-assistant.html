<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 助手 - 知趣·象限学习系统</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20260928-once-per-click" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20260928-once-per-click">
  <link rel="manifest" href="manifest.json?v=20260928-once-per-click">
  <meta name="theme-color" content="#2E538F">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20260928-once-per-click">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <!--
        height（不是 min-height）—— 内层正好等于视口减去 .zq-main 的上下 padding（110px），
        于是**整页不产生外层滚动**，长内容在对话区内部滚。
        这一条不只是观感：面板收起后，展开箭头在竖条顶端，是收起状态下唯一的展开入口。
        外层一滚它就跑出视野，人只能先滚回去才能展开 —— 用 min-height 时就是这样。
      -->
      <div style="display:flex;flex-direction:column;gap:12px;height:calc(100vh - 110px);animation:zqFadeIn .3s ease both;">
        <header style="padding:2px 2px 0;">
          <h1 class="zq-h1">AI 助手</h1>
        </header>

        <section style="flex:1;min-height:0;border:1px solid var(--zq-border-soft);border-radius:var(--zq-rm);background:var(--zq-card);box-shadow:var(--zq-sh2);overflow:hidden;display:flex;flex-direction:column;">
          <div style="display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--zq-border-soft);background:var(--zq-card-soft);">
            <span style="font-size:13.5px;font-weight:700;">AI 助手</span>
            <span id="zq-current-notebook" style="font-size:12px;color:var(--zq-text2);">普通聊天（未选择 Notebook）</span>
            <span style="margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--zq-ok);"><span style="width:7px;height:7px;border-radius:50%;background:var(--zq-ok);animation:zqPulse 2s infinite;"></span><span id="zq-sync-count">正在同步历史消息…</span></span>
          </div>

          <div style="flex:1;display:flex;gap:0;min-height:0;align-items:stretch;">
            <aside data-zq-collapse="left" data-zq-label="Notebook · 资料" style="flex:0 0 218px;border-right:1px solid var(--zq-border-soft);background:var(--zq-card-soft);display:flex;flex-direction:column;min-width:0;overflow-y:auto;">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--zq-border-soft);">
                <div><strong style="display:block;font-size:12.5px;font-weight:700;">Notebook</strong><span style="font-size:11px;color:var(--zq-text3);">资料工作区</span></div>
                <button id="zq-new-notebook" class="zq-btn-ghost" style="height:26px;padding:0 10px;font-size:11.5px;white-space:nowrap;margin-right:26px;">＋ 新建</button>
              </div>
              <div id="zq-notebooks" style="padding:10px 12px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--zq-border-soft);"></div>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;">
                <button id="zq-source-upload" class="zq-btn-ghost" style="height:28px;border-style:dashed;font-size:11.5px;">上传资料</button>
                <button id="zq-add-url" class="zq-btn-ghost" style="height:28px;border-style:dashed;font-size:11.5px;">添加 URL</button>
              </div>
              <div id="zq-sources" style="padding:2px 12px 14px;display:flex;flex-direction:column;gap:6px;"></div>

              <!-- 代码工作区。整块默认 hidden：工作区没开时（绝大多数部署）连标题都不出现，
                   由 zhiqu-api.js 根据 /api/workspace/status 决定显不显示。
                   非管理员拿不到那个接口，这一块同样不显示。 -->
              <section id="zq-ws" hidden style="border-top:1px solid var(--zq-border-soft);">
                <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;">
                  <div>
                    <strong style="display:block;font-size:12.5px;font-weight:700;">代码工作区</strong>
                    <span id="zq-ws-sub" style="font-size:11px;color:var(--zq-text3);"></span>
                  </div>
                  <div style="display:flex;align-items:center;gap:6px;flex:0 0 auto;">
                    <button id="zq-ws-up" class="zq-btn-ghost" hidden style="height:24px;padding:0 8px;font-size:11px;white-space:nowrap;">上一层</button>
                    <!-- 齿轮：打开工作区设置（选文件夹 + 切档位）。管理员总能看到，哪怕工作区当前是 OFF。 -->
                    <button id="zq-ws-settings" class="zq-btn-ghost" title="工作区设置：选文件夹、切档位" style="height:24px;width:24px;padding:0;font-size:13px;line-height:1;white-space:nowrap;">⚙</button>
                  </div>
                </div>
                <div id="zq-ws-search-row" hidden style="display:flex;gap:6px;padding:0 14px 8px;">
                  <input id="zq-ws-q" type="search" placeholder="搜索工作区（回车）" autocomplete="off"
                         style="flex:1;min-width:0;height:26px;padding:0 8px;border:1px solid var(--zq-border-soft);border-radius:var(--zq-rs);background:var(--zq-card-soft);color:var(--zq-text2);font-size:11.5px;" />
                  <button id="zq-ws-back" class="zq-btn-ghost" hidden style="height:26px;padding:0 8px;font-size:11px;white-space:nowrap;">返回目录</button>
                </div>
                <div id="zq-ws-path" class="zq-mono" style="padding:0 14px 6px;font-size:11px;color:var(--zq-text3);word-break:break-all;"></div>
                <div id="zq-ws-tree" style="padding:0 12px 14px;display:flex;flex-direction:column;gap:3px;"></div>
              </section>
            </aside>

            <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
              <!-- 定位容器：按钮要贴着聊天区的右下角，而不是整栏的右下角（那里是输入框）。
                   所以这一层只包住 #zq-chat，高度随它。 -->
              <div style="position:relative;display:flex;flex-direction:column;flex:1;min-height:0;">
                <div id="zq-chat" style="flex:1;overflow-y:auto;padding:20px 22px;display:flex;flex-direction:column;gap:16px;"></div>
                <!-- 用户往上翻着读时，流式新内容不再把他拽回底部；这个按钮是回去的入口。
                     默认 hidden，由 zhiqu-api.js 按「是否在底部」切换。 -->
                <button id="zq-chat-jump" type="button" hidden aria-label="回到最新内容"
                        style="position:absolute;right:20px;bottom:14px;z-index:3;height:30px;padding:0 13px;border:1px solid var(--zq-border);border-radius:999px;background:var(--zq-card);color:var(--zq-text2);font-size:12px;font-weight:600;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.14);">↓ 新内容</button>
              </div>
              <div style="padding:12px 18px 16px;border-top:1px solid var(--zq-border-soft);display:flex;flex-direction:column;gap:10px;">
                <div id="zq-drop-zone" class="zq-ai-drop-zone" role="button" tabindex="0" aria-label="拖拽或选择文件上传到当前 Notebook">
                  <span class="zq-ai-drop-icon">＋</span>
                  <span id="zq-drop-status">拖拽文件到此处 · 支持图片、PDF、Excel、文本（csv / txt / md / json）</span>
                </div>
                <div id="zq-attachments" class="zq-ai-attachments" hidden></div>
                <div style="display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap;">
                  <button id="zq-chat-upload" class="zq-btn-ghost" style="height:32px;font-size:12.5px;">上传</button>
                  <!-- textarea 而不是 input：单独回车要能换行，而 input 装不下换行符。
                       单行时高度 6+18+6+2=32px，与同排按钮对齐；输入变长由 JS 自适应到 120px 封顶。 -->
                  <textarea id="zq-draft" rows="1" placeholder="输入消息，⌘/Ctrl + 回车发送，回车换行..." style="flex:1;min-width:200px;height:32px;max-height:120px;padding:6px 12px;border:1px solid var(--zq-border);border-radius:var(--zq-rs);background:var(--zq-input-bg);color:var(--zq-text);font-size:13px;line-height:18px;font-family:inherit;resize:none;overflow-y:auto;"></textarea>
                  <!-- 「代码」：显式让 coding agent 在工作区里干活（读、写草稿、运行）。只在工作区生效时出现，
                       由 zhiqu-api.js 的 loadWorkspace 决定。按下后这一轮不再靠关键词猜 —— 见 ContextOptionKeys.CODE_MODE。 -->
                  <button id="zq-code" class="zq-btn-ghost" aria-pressed="false" hidden title="让 AI 直接在代码工作区里读、写（草稿确认后落盘）、运行" style="height:32px;padding:0 11px;font-size:12px;">代码</button>
                  <button id="zq-web" class="zq-btn-ghost" aria-pressed="false" style="height:32px;padding:0 11px;font-size:12px;">联网</button>
                  <button id="zq-think" class="zq-btn-ghost" aria-pressed="false" style="height:32px;padding:0 11px;font-size:12px;">深度思考</button>
                  <select id="zq-model" class="zq-select" style="height:32px;max-width:150px;min-width:0;flex:0 1 150px;font-size:12px;"><option value="">默认模型</option></select>
                  <button id="zq-send" class="zq-btn" style="height:32px;">发送</button>
                </div>
              </div>
            </div>

            <aside data-zq-collapse="right" data-zq-label="执行轨迹 · 产物" style="flex:0 0 262px;border-left:1px solid var(--zq-border-soft);background:var(--zq-card-soft);display:flex;flex-direction:column;min-width:0;overflow-y:auto;">
              <div style="padding:12px 14px;border-bottom:1px solid var(--zq-border-soft);">
                <strong style="display:block;font-size:12.5px;font-weight:700;">执行轨迹</strong>
                <span style="font-size:11px;color:var(--zq-text3);">Agent Pipeline</span>
                <div id="zq-steps" style="display:flex;flex-direction:column;margin-top:10px;"></div>
              </div>
              <div style="padding:12px 14px;">
                <strong style="display:block;font-size:12.5px;font-weight:700;">产物</strong>
                <span style="font-size:11px;color:var(--zq-text3);">来源、草稿与确认结果</span>
                <div id="zq-artifacts" style="display:flex;flex-direction:column;gap:7px;margin-top:10px;"></div>
              </div>
            </aside>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20260928-once-per-click"></script>
  <script src="assets/zhiqu-api.js?v=20260928-once-per-click"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>成就系统 - 知趣·象限学习系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/achievement.css">
    <link rel="stylesheet" href="/css/pixel-theme.css">
</head>
<body>
    <div id="navbar"></div>
    <div class="main-content">
        <h1 style="margin-top:0">🏆 成就系统</h1>
        <div class="ach-head">
            <div class="ach-meta" id="ach-summary"></div>
            <button type="button" class="btn btn-primary" id="btn-check">🔍 检测成就</button>
        </div>
        <div class="ach-filters" id="ach-filters">
            <button type="button" data-f="all" class="active">全部</button>
            <button type="button" data-f="unlocked">✅ 已解锁</button>
            <button type="button" data-f="locked">🔒 未解锁</button>
        </div>
        <div class="ach-grid" id="ach-grid"></div>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/achievement.js"></script>
</body>
</html>

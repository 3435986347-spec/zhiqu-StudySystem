<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成就系统 - 知趣·象限学习系统</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261004-cleanup" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261004-cleanup">
  <link rel="manifest" href="manifest.json?v=20261004-cleanup">
  <meta name="theme-color" content="#2E538F">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261004-cleanup">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px; animation:zqFadeIn .3s ease both;">
        <header style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:4px 2px 2px; flex-wrap:wrap;">
          <div>
            <p class="zq-eyebrow">激励体系</p><h1 class="zq-h1">成就系统</h1>
            <span style="display:block; margin-top:6px; color:var(--zq-text2); font-size:13px;">连续坚持、按期完成与深度专注，都会沉淀为这里的里程碑。</span>
          </div>
          <div id="zq-filters" style="display:inline-flex; border:1px solid var(--zq-border); border-radius:var(--zq-rs); overflow:hidden;"><button type="button" data-k="all" style="height:30px; padding:0 16px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:var(--zq-primary); color:var(--zq-on-primary);">全部</button><button type="button" data-k="on" style="height:30px; padding:0 16px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:var(--zq-card); color:var(--zq-text2);">已解锁</button><button type="button" data-k="off" style="height:30px; padding:0 16px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:var(--zq-card); color:var(--zq-text2);">未解锁</button></div>
        </header>

        <section class="zq-grid" style="grid-template-columns:repeat(4, minmax(0,1fr));">
          <article class="zq-stat"><span class="zq-stat-label">已解锁</span><strong class="zq-stat-num" style="color:var(--zq-primary);">—</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">全部成就</span><strong class="zq-stat-num">—</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">成就点数</span><strong class="zq-stat-num">—</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">最近解锁</span><strong style="display:block; margin-top:10px; font-size:14px; line-height:1.3;">—</strong><span style="display:block; margin-top:4px; font-size:11.5px; color:var(--zq-text3);"></span></article>
        </section>

        <div id="zq-ach" style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px;"></div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261004-cleanup"></script>
  <script src="assets/zhiqu-api.js?v=20261004-cleanup"></script>
</body>
</html>

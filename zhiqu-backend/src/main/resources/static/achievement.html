<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成就系统 - 知趣·象限学习系统</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/zhiqu-ui.css">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px; animation:zqFadeIn .3s ease both;">
        <header style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:4px 2px 2px; flex-wrap:wrap;">
          <div>
            <p class="zq-eyebrow">激励体系</p><h1 class="zq-h1">成就系统</h1>
            <span style="display:block; margin-top:6px; color:var(--zq-text2); font-size:13px;">连续坚持、按期完成与深度专注，都会沉淀为这里的里程碑。</span>
          </div>
          <div id="zq-filters" style="display:inline-flex; border:1px solid var(--zq-border); border-radius:var(--zq-rs); overflow:hidden;"></div>
        </header>

        <section class="zq-grid" style="grid-template-columns:repeat(4, minmax(0,1fr));">
          <article class="zq-stat"><span class="zq-stat-label">已解锁</span><strong class="zq-stat-num" style="color:var(--zq-primary);">9</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">全部成就</span><strong class="zq-stat-num">24</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">成就点数</span><strong class="zq-stat-num">340</strong></article>
          <article class="zq-stat"><span class="zq-stat-label">最近解锁</span><strong style="display:block; margin-top:10px; font-size:14px; line-height:1.3;">连续学习 21 天</strong><span style="display:block; margin-top:4px; font-size:11.5px; color:var(--zq-text3);">07-01 解锁</span></article>
        </section>

        <div id="zq-ach" style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:14px;"></div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js"></script>
  <script>
    var all = [
      ['◆','七日不辍','连续 7 天完成至少 1 项任务',1,7,7,20,'06-14'],
      ['◆','三周成习','连续 21 天完成至少 1 项任务',1,21,21,60,'07-01'],
      ['✦','百日筑基','连续 100 天完成至少 1 项任务',0,23,100,200,''],
      ['▣','首战告捷','完成第一个任务',1,1,1,5,'03-02'],
      ['▣','百炼成钢','累计完成 100 个任务',1,128,100,80,'06-20'],
      ['▣','五百强者','累计完成 500 个任务',0,128,500,250,''],
      ['◉','深度专注','单日完成 4 个番茄钟',1,4,4,30,'05-18'],
      ['◉','心流大师','累计专注 100 小时',0,47.6,100,150,''],
      ['☰','井井有条','四象限各保持并完成一轮清空',1,1,1,40,'04-11'],
      ['↻','例行入门','创建第一个例行计划并坚持 7 天',1,7,7,25,'04-02'],
      ['✉','早起打卡王','早八后 1 小时内完成晨间任务累计 30 次',0,19,30,60,''],
      ['❏','计划分享者','提交 1 个共享计划模板并通过审核',0,0,1,50,'']
    ];
    var filter='all';
    document.getElementById('zq-filters').innerHTML = [['all','全部'],['on','已解锁'],['off','未解锁']].map(function(f){
      return '<button onclick="setF(\''+f[0]+'\')" data-k="'+f[0]+'" style="height:30px; padding:0 16px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:'+(filter===f[0]?'var(--zq-primary)':'var(--zq-card)')+'; color:'+(filter===f[0]?'var(--zq-on-primary)':'var(--zq-text2)')+';">'+f[1]+'</button>';
    }).join('');
    function setF(k){ filter=k; document.querySelectorAll('#zq-filters button').forEach(function(b){ var on=b.dataset.k===k; b.style.background=on?'var(--zq-primary)':'var(--zq-card)'; b.style.color=on?'var(--zq-on-primary)':'var(--zq-text2)'; }); paint(); }
    function paint(){
      var list = all.filter(function(a){ return filter==='all'?true:(filter==='on'?a[3]:!a[3]); });
      document.getElementById('zq-ach').innerHTML = list.map(function(a){
        var unlocked=a[3], pct=Math.min(100,Math.round(a[4]/a[5]*100));
        return '<article style="padding:16px; border:1px solid '+(unlocked?'var(--zq-ok-tint)':'var(--zq-border-soft)')+'; border-radius:var(--zq-rm); background:var(--zq-card); box-shadow:var(--zq-sh1); opacity:'+(unlocked?1:0.82)+';">'
          + '<div style="display:flex; align-items:center; gap:12px; margin-bottom:10px;"><div style="width:42px; height:42px; flex:none; border-radius:50%; background:'+(unlocked?'var(--zq-ok-tint)':'var(--zq-card-soft)')+'; color:'+(unlocked?'var(--zq-ok)':'var(--zq-text3)')+'; display:flex; align-items:center; justify-content:center; font-size:18px;">'+a[0]+'</div><div style="min-width:0;"><h3 style="margin:0; font-size:14.5px; font-weight:700;">'+a[1]+'</h3><span style="font-size:11.5px; color:'+(unlocked?'var(--zq-ok)':'var(--zq-text3)')+'; font-weight:600;">'+(unlocked?'已解锁 · '+a[7]:'进行中')+'</span></div></div>'
          + '<p style="margin:0 0 10px; font-size:12.5px; color:var(--zq-text2); line-height:1.55; min-height:38px;">'+a[2]+'</p>'
          + '<div style="height:6px; border-radius:999px; background:var(--zq-card-soft); overflow:hidden;"><i style="display:block; width:'+pct+'%; height:100%; border-radius:inherit; background:'+(unlocked?'var(--zq-ok)':'var(--zq-primary)')+';"></i></div>'
          + '<div style="display:flex; justify-content:space-between; margin-top:7px; font-size:11.5px; color:var(--zq-text3);"><span>'+(unlocked?'已完成':a[4]+' / '+a[5])+'</span><span class="zq-mono">+'+a[6]+' 点</span></div></article>';
      }).join('');
    }
    paint();
  </script>
  <script src="assets/zhiqu-api.js?v=20260707-wire-all18"></script>
</body>
</html>

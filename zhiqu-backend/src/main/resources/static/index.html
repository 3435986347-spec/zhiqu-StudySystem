<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 知趣·象限学习系统</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Poppins:wght@600;700&family=JetBrains+Mono:wght@400;600&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/pixel-theme.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <h1>知趣·象限学习系统</h1>
            <p class="login-sub">📚 欢迎使用自主学习看板</p>
            <div class="tabs">
                <button type="button" class="tab-btn active" data-tab="login">登录</button>
                <button type="button" class="tab-btn" data-tab="register">注册</button>
            </div>
            <div id="panel-login" class="tab-panel">
                <form id="form-login">
                    <div class="form-group">
                        <label for="login-username">用户名</label>
                        <input id="login-username" name="username" required autocomplete="username" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="login-password">密码</label>
                        <input id="login-password" type="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
                    </div>
                    <div id="login-error" class="error-msg"></div>
                    <div class="login-actions">
                        <button type="submit" class="btn btn-primary">登录</button>
                    </div>
                </form>
            </div>
            <div id="panel-register" class="tab-panel hidden">
                <form id="form-register">
                    <div class="form-group">
                        <label for="reg-username">用户名</label>
                        <input id="reg-username" name="username" required autocomplete="username" placeholder="请输入用户名">
                    </div>
                    <div class="form-group">
                        <label for="reg-password">密码</label>
                        <input id="reg-password" type="password" name="password" required autocomplete="new-password" placeholder="至少6位密码">
                    </div>
                    <div class="form-group">
                        <label for="reg-confirm">确认密码</label>
                        <input id="reg-confirm" type="password" name="confirmPassword" required autocomplete="new-password" placeholder="再次输入密码">
                    </div>
                    <div id="register-error" class="error-msg"></div>
                    <div class="login-actions">
                        <button type="submit" class="btn btn-primary">注册</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="/js/common.js"></script>
    <script src="/js/login.js"></script>
</body>
</html>

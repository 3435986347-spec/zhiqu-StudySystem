<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>例行计划 - 知趣·象限 AI 办公助手</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="assets/icons/icon-192.png?v=20261004-tasks" sizes="192x192">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=20261004-tasks">
  <link rel="manifest" href="manifest.json?v=20261004-tasks">
  <meta name="theme-color" content="#2E538F">
  <link rel="stylesheet" href="assets/zhiqu-ui.css?v=20261004-tasks">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px; animation:zqFadeIn .3s ease both;">
        <header style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:4px 2px 2px;">
          <div>
            <p class="zq-eyebrow">长期节奏</p><h1 class="zq-h1">例行计划</h1>
            <span style="display:block; margin-top:6px; color:var(--zq-text2); font-size:13px;">每天背单词、每周复盘这类长期动作放在这里，不再挤占普通任务列表。</span>
          </div>
          <a href="dashboard.html" class="zq-btn-ghost" style="height:32px;">回到看板</a>
        </header>

        <!-- 从任务生成 -->
        <section class="zq-card zq-card-lg">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;">
            <div><p class="zq-eyebrow">从任务生成</p><h2 class="zq-h2">从已有任务生成例行计划</h2></div>
            <div style="display:flex; gap:8px;"><select class="zq-select" style="height:30px;"><option>全部任务</option><option>待办</option><option>进行中</option></select><button class="zq-btn-ghost" style="height:30px;">刷新</button></div>
          </div>
          <div style="display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr); gap:16px;">
            <div id="zq-src" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; padding-right:4px;"></div>
            <div style="display:flex; flex-direction:column; gap:12px; padding:14px; border:1px solid var(--zq-border-soft); border-radius:var(--zq-rs); background:var(--zq-card-soft);">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">频率</label><select class="zq-select" style="height:30px;"><option>每天</option><option>每周</option></select></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">预计时长（分钟）</label><input class="zq-input" type="number" value="45" style="height:30px;"></div>
              </div>
              <div id="zq-wd" style="display:flex; gap:5px; flex-wrap:wrap;"><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周一</button><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周二</button><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周三</button><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周四</button><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周五</button><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周六</button><button type="button" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">周日</button></div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">偏好时间</label><input class="zq-input" type="time" value="08:00" style="height:30px;"></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">早间提醒</label><select class="zq-select" style="height:30px;"><option>开启</option><option>关闭</option></select></div>
              </div>
              <button class="zq-btn">生成例行计划</button>
            </div>
          </div>
        </section>

        <div style="display:grid; grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr); gap:16px; align-items:start;">
          <!-- 新建 -->
          <section class="zq-card zq-card-lg">
            <div style="margin-bottom:12px;"><p class="zq-eyebrow">新建</p><h2 class="zq-h2">新建例行计划</h2></div>
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">标题</label><input class="zq-input" placeholder="例如：英语单词复习"></div>
              <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">说明</label><textarea class="zq-textarea" placeholder="可写资料、目标或注意事项"></textarea></div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">频率</label><select class="zq-select"><option>每天</option><option>每周</option></select></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">预计时长</label><input class="zq-input" type="number" value="45"></div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">开始日期</label><input class="zq-input" type="date"></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">结束日期</label><input class="zq-input" type="date"></div>
              </div>
              <button class="zq-btn">创建例行计划</button>
            </div>
          </section>
          <!-- 我的例行计划 -->
          <section class="zq-card zq-card-lg">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
              <div><p class="zq-eyebrow">进行中</p><h2 class="zq-h2">我的例行计划</h2></div>
              <span id="zq-rt-count" style="font-size:12px; color:var(--zq-text3);"></span>
            </div>
            <div id="zq-rt" style="display:flex; flex-direction:column; gap:10px;"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js?v=20261004-tasks"></script>
  <script src="assets/zhiqu-api.js?v=20261004-tasks"></script>
</body>
</html>

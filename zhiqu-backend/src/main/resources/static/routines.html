<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>例行计划 - 知趣·象限学习系统</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/zhiqu-ui.css">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px; animation:zqFadeIn .3s ease both;">
        <header style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:4px 2px 2px;">
          <div>
            <p class="zq-eyebrow">长期节奏</p><h1 class="zq-h1">例行计划</h1>
            <span style="display:block; margin-top:6px; color:var(--zq-text2); font-size:13px;">每天背单词、每周复盘这类长期动作放在这里，不再挤占普通任务列表。</span>
          </div>
          <a href="dashboard.html" class="zq-btn-ghost" style="height:32px;">回到看板</a>
        </header>

        <!-- 从任务生成 -->
        <section class="zq-card zq-card-lg">
          <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:14px;">
            <div><p class="zq-eyebrow">从任务生成</p><h2 class="zq-h2">从已有任务生成例行计划</h2></div>
            <div style="display:flex; gap:8px;"><select class="zq-select" style="height:30px;"><option>全部任务</option><option>待办</option><option>进行中</option></select><button class="zq-btn-ghost" style="height:30px;">刷新</button></div>
          </div>
          <div style="display:grid; grid-template-columns:minmax(0,1.2fr) minmax(280px,1fr); gap:16px;">
            <div id="zq-src" style="display:flex; flex-direction:column; gap:8px; max-height:300px; overflow-y:auto; padding-right:4px;"></div>
            <div style="display:flex; flex-direction:column; gap:12px; padding:14px; border:1px solid var(--zq-border-soft); border-radius:var(--zq-rs); background:var(--zq-card-soft);">
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">频率</label><select class="zq-select" style="height:30px;"><option>每天</option><option>每周</option></select></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">预计时长（分钟）</label><input class="zq-input" type="number" value="45" style="height:30px;"></div>
              </div>
              <div id="zq-wd" style="display:flex; gap:5px; flex-wrap:wrap;"></div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">偏好时间</label><input class="zq-input" type="time" value="08:00" style="height:30px;"></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">早八提醒</label><select class="zq-select" style="height:30px;"><option>开启</option><option>关闭</option></select></div>
              </div>
              <button class="zq-btn">生成例行计划</button>
            </div>
          </div>
        </section>

        <div style="display:grid; grid-template-columns:minmax(300px,1fr) minmax(0,1.5fr); gap:16px; align-items:start;">
          <!-- 新建 -->
          <section class="zq-card zq-card-lg">
            <div style="margin-bottom:12px;"><p class="zq-eyebrow">新建</p><h2 class="zq-h2">新建例行计划</h2></div>
            <div style="display:flex; flex-direction:column; gap:12px;">
              <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">标题</label><input class="zq-input" placeholder="例如：英语单词复习"></div>
              <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">说明</label><textarea class="zq-textarea" placeholder="可写资料、目标或注意事项"></textarea></div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">频率</label><select class="zq-select"><option>每天</option><option>每周</option></select></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">预计时长</label><input class="zq-input" type="number" value="45"></div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">开始日期</label><input class="zq-input" type="date" value="2026-07-06"></div>
                <div class="zq-field" style="gap:5px;"><label class="zq-label" style="font-size:11.5px;">结束日期</label><input class="zq-input" type="date" value="2026-08-30"></div>
              </div>
              <button class="zq-btn">创建例行计划</button>
            </div>
          </section>
          <!-- 我的例行计划 -->
          <section class="zq-card zq-card-lg">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
              <div><p class="zq-eyebrow">进行中</p><h2 class="zq-h2">我的例行计划</h2></div>
              <span style="font-size:12px; color:var(--zq-text3);">5 个进行中</span>
            </div>
            <div id="zq-rt" style="display:flex; flex-direction:column; gap:10px;"></div>
          </section>
        </div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js"></script>
  <script>
    var src = [
      ['英语六级真题模考（2024-12 卷）','截止 07-05 12:00 · 重要不紧急',1],
      ['数据结构二轮复习 · 图论专题','截止 07-09 22:00 · 重要不紧急',1],
      ['考研政治 · 马原选择题 30 题','截止 07-07 22:00 · 重要不紧急',0],
      ['毕设开题报告 · 文献综述初稿','截止 07-06 23:59 · 进行中',0],
      ['高数错题整理','无截止 · 不重要不紧急',0]
    ];
    document.getElementById('zq-src').innerHTML = src.map(function(s,i){
      return '<label style="display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid '+(s[2]?'var(--zq-tint-strong)':'var(--zq-border-soft)')+'; border-radius:var(--zq-rs); background:'+(s[2]?'var(--zq-tint)':'var(--zq-card)')+'; cursor:pointer;"><input type="checkbox" '+(s[2]?'checked':'')+' style="accent-color:var(--zq-primary);"><div style="min-width:0; flex:1;"><div style="font-size:13px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">'+s[0]+'</div><div style="font-size:11.5px; color:var(--zq-text3); margin-top:2px;">'+s[1]+'</div></div></label>';
    }).join('');

    var wd = ['周一','周二','周三','周四','周五','周六','周日'];
    document.getElementById('zq-wd').innerHTML = wd.map(function(d,i){
      var on = i<7;
      return '<button type="button" onclick="this.dataset.on=this.dataset.on===\'1\'?\'0\':\'1\';paintWd(this)" data-on="1" style="height:26px; padding:0 10px; border:1px solid var(--zq-primary); border-radius:999px; background:var(--zq-tint); color:var(--zq-primary); font-size:11.5px; font-weight:600; cursor:pointer;">'+d+'</button>';
    }).join('');
    function paintWd(b){ var on=b.dataset.on==='1'; b.style.borderColor=on?'var(--zq-primary)':'var(--zq-border)'; b.style.background=on?'var(--zq-tint)':'var(--zq-card)'; b.style.color=on?'var(--zq-primary)':'var(--zq-text2)'; }

    var rt = [
      ['08:00','晨间单词 60 个','每天 · 25 分钟 · 早八提醒已开','23 天',1],
      ['12:40','午间听力 15 分钟','每天 · 15 分钟','11 天',1],
      ['18:30','算法题每日一道','每天 · 40 分钟','17 天',1],
      ['21:30','每周复盘 · 学习日志','每周五 · 20 分钟','9 周',0],
      ['22:10','政治时政速览','周一/三/五 · 10 分钟','6 周',0]
    ];
    function paintRt(){
      document.getElementById('zq-rt').innerHTML = rt.map(function(r,i){
        return '<div style="display:flex; align-items:center; gap:11px; padding:11px 13px; border:1px solid var(--zq-border-soft); border-radius:var(--zq-rs); background:var(--zq-card);">'
          + '<div style="flex:none; min-width:46px; height:32px; padding:0 8px; border-radius:var(--zq-rs); background:var(--zq-tint); color:var(--zq-primary); display:flex; align-items:center; justify-content:center; font-family:var(--zq-fontM,\'JetBrains Mono\'); font-size:12px; font-weight:600; white-space:nowrap;" class="zq-mono">'+r[0]+'</div>'
          + '<div style="flex:1; min-width:0;"><div style="font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+r[1]+'</div><div style="font-size:11.5px; color:var(--zq-text2); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">'+r[2]+'</div></div>'
          + '<div style="flex:none; text-align:right; white-space:nowrap;"><div class="zq-mono" style="font-size:13px; font-weight:600; color:var(--zq-primary);">'+r[3]+'</div><div style="font-size:11px; color:var(--zq-text3);">连续</div></div>'
          + '<button onclick="rt['+i+'][4]=rt['+i+'][4]?0:1;paintRt()" style="flex:none; height:28px; padding:0 11px; border:1px solid '+(r[4]?'var(--zq-ok-tint)':'var(--zq-border)')+'; border-radius:var(--zq-rs); background:'+(r[4]?'var(--zq-ok-tint)':'var(--zq-card)')+'; color:'+(r[4]?'var(--zq-ok)':'var(--zq-text2)')+'; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap;">'+(r[4]?'今日已完成':'标记完成')+'</button></div>';
      }).join('');
    }
    paintRt();
  </script>
  <script src="assets/zhiqu-api.js?v=20260707-wire-all12"></script>
</body>
</html>

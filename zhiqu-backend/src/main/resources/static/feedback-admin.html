<!DOCTYPE html>
<html lang="zh-CN" data-zq-ver="v1" data-zq-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>反馈管理 - 知趣·象限学习系统</title>
  <script>(function(){try{var v=localStorage.getItem('zq.ver')||'v1',m=localStorage.getItem('zq.mode')||'light';document.documentElement.setAttribute('data-zq-ver',v);document.documentElement.setAttribute('data-zq-mode',m);}catch(e){}})();</script>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/zhiqu-ui.css">
</head>
<body>
  <div class="zq-app">
    <nav id="zq-side"></nav>
    <main class="zq-main">
      <div style="display:flex; flex-direction:column; gap:16px; animation:zqFadeIn .3s ease both;">
        <header style="display:flex; align-items:flex-end; justify-content:space-between; gap:18px; padding:4px 2px 2px; flex-wrap:wrap;">
          <div><p class="zq-eyebrow">管理员</p><h1 class="zq-h1">反馈管理</h1></div>
          <div id="zq-filters" style="display:inline-flex; border:1px solid var(--zq-border); border-radius:var(--zq-rs); overflow:hidden;"></div>
        </header>
        <div id="zq-list" style="display:flex; flex-direction:column; gap:10px;"></div>
      </div>
    </main>
  </div>

  <script src="assets/zhiqu-ui.js"></script>
  <script>
    var meta={0:['待处理','var(--zq-bad-tint)','var(--zq-bad)','标记处理中'],1:['处理中','var(--zq-warn-tint)','var(--zq-warn)','标记已解决'],2:['已解决','var(--zq-ok-tint)','var(--zq-ok)','重新打开']};
    var fb=[
      ['李晓彤','07-04 09:31',0,'建议番茄钟结束后可以自动开始休息倒计时，现在要手动点一次。'],
      ['陈宇航','07-03 22:18',0,'AI 识别课表时偶尔把教室号（如 3-201）当成时间，希望优化。'],
      ['匿名用户','07-03 16:02',1,'日历周视图在 13 寸屏幕上第七列会被挤压，需要横向滚动。'],
      ['林可','07-02 20:45',1,'希望例行计划支持「隔周」频率，实验课是单双周交替的。'],
      ['苏文','07-01 11:20',2,'成就页在弱网下加载较慢。（已回复：已加缓存，下版本发布）']
    ];
    var filter='all';
    document.getElementById('zq-filters').innerHTML=[['all','全部'],['0','待处理'],['1','处理中'],['2','已解决']].map(function(f){
      return '<button onclick="setF(\''+f[0]+'\')" data-k="'+f[0]+'" style="height:30px; padding:0 14px; border:none; cursor:pointer; font-size:12.5px; font-weight:600; background:'+(filter===f[0]?'var(--zq-primary)':'var(--zq-card)')+'; color:'+(filter===f[0]?'var(--zq-on-primary)':'var(--zq-text2)')+';">'+f[1]+'</button>';
    }).join('');
    function setF(k){ filter=k; document.querySelectorAll('#zq-filters button').forEach(function(b){var on=b.dataset.k===k;b.style.background=on?'var(--zq-primary)':'var(--zq-card)';b.style.color=on?'var(--zq-on-primary)':'var(--zq-text2)';}); paint(); }
    function paint(){
      var list=fb.map(function(f,i){return [f,i];}).filter(function(x){ return filter==='all'||String(x[0][2])===filter; });
      document.getElementById('zq-list').innerHTML=list.map(function(x){
        var f=x[0], i=x[1], m=meta[f[2]];
        return '<article class="zq-card"><div style="display:flex; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;"><span class="zq-badge" style="background:'+m[1]+'; color:'+m[2]+'; font-weight:700;">'+m[0]+'</span><span style="font-size:12.5px; font-weight:600;">'+f[0]+'</span><span class="zq-mono" style="font-size:11.5px; color:var(--zq-text3);">'+f[1]+'</span><span style="margin-left:auto; display:inline-flex; gap:6px;"><button onclick="fb['+i+'][2]=(fb['+i+'][2]+1)%3;paint()" style="height:26px; padding:0 11px; border:1px solid var(--zq-tint-strong); border-radius:var(--zq-rs); background:var(--zq-tint); color:var(--zq-primary); font-size:12px; font-weight:600; cursor:pointer;">'+m[3]+'</button><button class="zq-btn-ghost" style="height:26px; padding:0 11px; font-size:12px;">回复</button></span></div><p style="margin:0; font-size:13px; line-height:1.6;">'+f[3]+'</p></article>';
      }).join('');
    }
    paint();
  </script>
  <script src="assets/zhiqu-api.js?v=20260707-wire-all12"></script>
</body>
</html>
